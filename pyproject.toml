[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartouche-mcp"
version = "0.2.0"
description = "Intent lock for AI-assisted builds: watch a clip per task, sign it, and seal the build only when the tree is the signed intent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
]

[project.scripts]
cartouche = "cartouche.cli:main"
cartouche-mcp = "cartouche.mcp:main"

[tool.setuptools.packages.find]
include = ["cartouche*"]
exclude = ["cartouche.tests*"]
